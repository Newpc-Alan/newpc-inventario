<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0F2C4A">
<meta name="description" content="NEWPC Inventário — Gestão Inteligente de Ativos de TI">
<title>NEWPC Inventário</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/newpc.css">
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div class="login-tela" id="tela-login">
  <div class="login-caixa">
    <div class="login-marca">
      <div class="logo">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
          <path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/>
        </svg>
      </div>
      <h1>NEWPC INVENTÁRIO</h1>
      <p>Gestão Inteligente de Ativos de TI</p>
    </div>
    <form id="form-login">
      <div class="campo" style="margin-bottom:12px">
        <label>E-mail</label>
        <input class="inp" type="email" id="li-email" autocomplete="username" required placeholder="voce@newpc.com.br">
      </div>
      <div class="campo" style="margin-bottom:16px">
        <label>Senha</label>
        <input class="inp" type="password" id="li-senha" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <div id="li-erro" class="aviso err oculto" style="margin-bottom:13px"></div>
      <button class="btn p bloco lg" type="submit" id="li-btn">Entrar</button>
      <button class="btn bloco" type="button" id="li-esqueci" style="margin-top:9px;border:0;background:transparent;color:#5B6F80">
        Esqueci minha senha
      </button>
    </form>
    <p style="text-align:center;font-size:11px;color:#9AAAB8;margin-top:18px">
      NEWPC Tecnologia · Acesso restrito e monitorado
    </p>
  </div>
</div>

<!-- ===================== APLICAÇÃO ===================== -->
<div class="app" id="app">
  <header class="topo">
    <button class="btn-menu" id="btn-menu" aria-label="Menu">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="marca" href="#/home" style="color:#fff">
      <span class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/>
        </svg>
      </span>
      <span><b>NEWPC INVENTÁRIO</b><span>Gestão Inteligente de Ativos de TI</span></span>
    </a>

    <div class="busca-global" id="busca-global">
      <span class="ic">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </span>
      <input type="search" id="inp-busca" placeholder="Buscar patrimônio, serial, service tag, modelo…"
             autocomplete="off" aria-label="Pesquisa global">
      <div class="busca-res oculto" id="busca-res"></div>
    </div>

    <div class="topo-dir">
      <button class="btn-ico" id="btn-scan" title="Escanear QR Code">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></svg>
      </button>
      <button class="btn-ico" id="btn-alertas" title="Alertas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
        <span class="badge-n oculto" id="badge-alertas">0</span>
      </button>
      <button class="chip-user" id="btn-user">
        <span class="avatar" id="user-ini">–</span>
        <span class="txt"><b id="user-nome">…</b><span id="user-perfil">…</span></span>
      </button>
    </div>
  </header>

  <nav class="lateral" id="lateral"></nav>
  <div class="velo" id="velo"></div>
  <main class="conteudo" id="conteudo"></main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
